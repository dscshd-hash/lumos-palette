<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Палитра Lumos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f2f2f0; --surface: #ffffff; --ink: #1d1e1c; --muted: #6f716c; --line: #dcdcd8;
  --accent: #2f3a33; --warn: #9a5b12; --warn-bg: #fbf0e0; --ok: #2f6b3f; --ok-bg: #e7f1e9; --hatch: #e6e6e2;
  --font-ui: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1c1b; --surface: #242524; --ink: #ecece8; --muted: #a2a49e; --line: #3a3b39;
    --accent: #cfd8d1; --warn: #f0b25e; --warn-bg: #3a2c19; --ok: #8fd09f; --ok-bg: #1f3325; --hatch: #2e2f2d; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) 64px;
}
.wrap { max-width: 1280px; margin: 0 auto; }

/* lock screen */
.lock { min-height: 80vh; display: grid; place-items: center; }
.lock form { display: grid; gap: 12px; width: min(320px, 100%); }
.lock h1 { font-size: 24px; margin: 0; }
.lock p { margin: 0; color: var(--muted); }
.lock input { font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); letter-spacing: 0.1em; }
.lock input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.lock button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); cursor: pointer; }
.lock .err { color: var(--warn); min-height: 20px; font-size: 13px; }

header.top { padding-block: 32px 16px; display: grid; gap: 12px; }
h1.title { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: baseline; gap: 8px; }
.stat b { font-size: 20px; font-weight: 600; }
.stat span { color: var(--muted); }

nav.groups { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; display: flex; gap: 6px; overflow-x: auto; }
nav.groups a { flex: none; text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
nav.groups a small { color: var(--muted); font-weight: 500; margin-left: 4px; }

section.group { padding-block: 36px 8px; scroll-margin-top: 64px; display: grid; gap: 14px; }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.ghead h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.ghead .meta { color: var(--muted); font-size: 13px; }
.photo { overflow-x: auto; border-radius: 6px; background: var(--hatch); }
.photo img { display: block; width: 100%; min-width: 720px; height: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; align-content: start; min-width: 0; }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 8px; }
.code { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
.hex { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.hex.set { color: var(--ink); }
.swatch { height: 64px; border-block: 1px solid var(--line); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px);
  display: grid; place-items: center; }
.swatch span { font-size: 11px; color: var(--muted); background: var(--surface); padding: 2px 6px; border-radius: 4px; }
.fields { display: grid; gap: 6px; padding: 10px 12px 12px; }
.en { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
.names { display: grid; gap: 4px; }
.nm { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; padding: 4px 8px; border-radius: 5px; background: var(--bg); }
.nm small { grid-column: 1 / -1; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.nm span { font-size: 15px; }
.nm b { color: var(--ok); font-size: 14px; }
.nm.chosen { background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
.tag-redo { justify-self: start; font-size: 12px; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 10px; }
.card.approved { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.card.redo { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.label-src { font-size: 11px; color: var(--muted); }
.label-src.odd { color: var(--warn); }
footer { color: var(--muted); font-size: 12px; padding-top: 32px; }
@media (max-width: 480px) { h1.title { font-size: 24px; } .grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="lock">
    <form id="lock" autocomplete="on">
      <h1>Палитра Lumos</h1>
      <p>Введите пароль</p>
      <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Пароль" required>
      <button type="submit">Открыть</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
</div>

const KEY = "lumos-palette-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(d) {
  const app = document.getElementById("app"); app.textContent = "";
  const all = d.groups.filter(g => !g.extra).flatMap(g => g.colors);
  const n = all.length;
  const picked = all.filter(c => ["ru", "ru2"].includes(c.pick)).length;
  const redo = all.filter(c => c.pick === "none").length;
  const header = el("header", "top");
  header.append(el("h1", "title", "Палитра Lumos by Thomas"),
    el("p", "lede", `Все цвета палитры по группам: HEX для экрана и два варианта русского названия. Галкой отмечено выбранное. Обновлено ${d.built}.`));
  const stats = el("div", "stats");
  for (const [b, t] of [[n, "цветов в 10 группах"], [`${all.filter(c => c.hex).length}/${n}`, "HEX определено"], [`${picked}/${n}`, "названий выбрано"], [redo, "на переделку"]]) {
    const s = el("div", "stat"); s.append(el("b", null, b), el("span", null, t)); stats.append(s);
  }
  header.append(stats);
  const nav = el("nav", "groups");
  const main = el("main");
  for (const g of d.groups) {
    const a = el("a", null, g.name); a.href = "#" + g.key; a.append(el("small", null, g.colors.length)); nav.append(a);
    const sec = el("section", "group"); sec.id = g.key;
    const head = el("div", "ghead");
    head.append(el("h2", null, g.name), el("span", "meta", g.extra ? `${g.colors.length} цветов · есть на цифровых плашках, но нет на выкрасах; в палитру не входят` : `${g.colors.length} цветов · от светлого (01) к тёмному`));
    const grid = el("div", "grid");
    for (const c of g.colors) {
      const k = el("article", "card" + (["ru", "ru2"].includes(c.pick) ? " approved" : c.pick === "none" ? " redo" : ""));
      const ch = el("div", "chead");
      ch.append(el("span", "code", `${g.name.toUpperCase()} ${c.num}`), el("span", "hex" + (c.hex ? " set" : ""), c.hex ? c.hex.toUpperCase() : "HEX —"));
      const sw = el("div", "swatch");
      if (c.hex) sw.style.background = c.hex; else sw.append(el("span", null, "HEX ещё нет"));
      k.append(ch, sw);
      const f = el("div", "fields");
      f.append(el("div", "en", c.en));
      const names = el("div", "names");
      for (const [key, label] of [["ru", "Основное"], ["ru2", "Запасное"]]) {
        if (!c[key]) continue;
        const row = el("div", "nm" + (c.pick === key ? " chosen" : ""));
        row.append(el("small", null, label), el("span", null, c[key]));
        if (c.pick === key) row.append(el("b", null, "✓"));
        names.append(row);
      }
      if (names.childElementCount) f.append(names);
      if (c.pick === "none") f.append(el("div", "tag-redo", "Ни одно не нравится"));
      if (c.label) f.append(el("div", "label-src" + (c.labelOdd ? " odd" : ""), "Подпись: " + c.label + (c.labelOdd ? " (не как у группы)" : "")));
      k.append(f); grid.append(k);
    }
    sec.append(head, grid); main.append(sec);
  }
  app.append(header, nav, main, el("footer", null, "Только для просмотра."));
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

async function open(pw, silent) {
  try {
    const d = await decrypt(pw);
    try { localStorage.setItem(KEY, pw); } catch {}
    render(d);
  } catch {
    try { localStorage.removeItem(KEY); } catch {}
    if (!silent) document.getElementById("err").textContent = "Неверный пароль.";
  }
}
document.getElementById("lock").addEventListener("submit", e => { e.preventDefault(); open(document.getElementById("pw").value, false); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
if (saved) open(saved, true);
</script>
</body>
